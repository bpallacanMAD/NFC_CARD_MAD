<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#000000">
    <meta name="description" content="Tarjeta de contacto digital">

    <title>Bastián Pallacán</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="card">

        <div class="profile">

            <img
                src="foto.jpg"
                alt="Bastián Pallacán"
                class="profile-image"
                onerror="this.style.display='none';"
            >

            <h1>Bastián Pallacán</h1>

            <p class="job">
                Ingeniero Informático
            </p>

            <p class="company">
                MAD S.A.
            </p>

        </div>


        <div class="actions">

            <a href="contacto.vcf" class="main-button">
                <span>＋</span>
                Guardar contacto
            </a>

            <a href="tel:+569XXXXXXXX" class="button">
                📞 Llamar
            </a>

            <a href="mailto:correo@ejemplo.cl" class="button">
                ✉️ Correo
            </a>

            <a href="https://wa.me/569XXXXXXXX" class="button">
                💬 WhatsApp
            </a>

            <a
                href="https://www.linkedin.com/"
                target="_blank"
                class="button"
            >
                💼 LinkedIn
            </a>

        </div>


        <p class="nfc">
            Acerca tu teléfono para compartir mis datos
        </p>

    </main>

    <script src="script.js"></script>

</body>
</html>
